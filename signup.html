<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Scape</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section class="logbods">
        <!-- the header and nav bar -->
        <header class="header">
            <a class="logo" href="index.html">S C A P E</a>
        </header>
        <div class="signsection">
            <h1 class="join">Join Scape Today!</h1>
            <form action="" class="signform">
                <label for="name">Full Name</label>
                <input type="text" name="full name" required>
                <label for="email">Email Address</label>
                <input type="email" name="email address" required>
                <div class="gender">
                    <div>
                        <input class="chkbox" type="radio" name="male">
                        <label for="gender">Male</label>
                    </div>
                    <div>
                        <input class="chkbox" type="radio" name="female">
                        <label for="gender">Female</label>
                    </div>
                </div>
                <label for="age">Age</label>
                <input type="date" name="age" required>
                <label for="password">Password</label>
                <input type="password" name="password" placeholder="*******" required>
                <label for="password">Confirm Password</label>
                <input type="password" name="confirm password" placeholder="*******" required>
                <div class="terms">
                    <div class="termdiv">
                        <input type="checkbox" name="terms">
                        <p>Accept our <a class="signB" href="">Terms and Policy</a></p>
                    </div>
                    <div>
                        <h4>
                            Already have an account? <a class="signA" href="login.html">Log in</a>
                        </h4>
                    </div>
                </div>
                <div>
                    <button class="signbtn" type="submit">REGISTER</button>
                </div>
            </form>
            <div class="signcon">
                <div class="signtext">
                    <h2>
                        Join SCAPE today
                    </h2>
                    <article>
                        Enjoy seamless trading experience <br>
                        Personalized recommendations, and exclusive offers. <br> 
                        Sign up and take the first step towards financial freedom!
                    </article>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
