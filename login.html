<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scape-Log In</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <section class="logbod">
        <!-- the header and nav bar -->
        <header class="header">
            <a class="logo" href="index.html">S C A P E</a>
        </header>
        <div class="logdivs">
            <h1>
                Welcome to SCAPE
            </h1>
        </div>
        <div class="logcon">
            <h2 class="dash">Log in to access dashboard</h2>
            <form class="loginform">
                <div class="formdiv">
                    <label for="name">Username</label>
                    <input type="text">
                </div>
                <div style="margin-top: 20px;" class="formdiv">
                    <label for="password">Password</label>
                    <input type="password">
                </div>
                <div class="me">
                    <input type="checkbox" name="">
                    <label for="name">Remember me</label>
                </div>
                <div class="formbtn">
                    <button type="submit">Login</button>
                </div>
                <div class="register">
                    <a href="">Forgot Password ?</a>
                    <a href="signup.html">Register Now!</a>
                </div>
            </form>
            <div class="divconts">
                <p>
                    Experience the future 
                </p>
                <p>
                    Shopping with Scape.
                </p>
            </div>
            <div class="logdiv">
                <div class="divcont">
                    <h1>
                        Welcome to SCAPE
                    </h1>
                    <p>
                        Experience the future of shopping with Scape. 
                    </p>
                </div>
            </div>
            <!-- mobile view  -->
        </div>
    </section>
</body>
</html>
